services:
  - type: web
    name: inventario-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: inventario-db
    plan: free
    databaseName: inventario
    user: inventario
